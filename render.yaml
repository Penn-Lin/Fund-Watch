services:
  - type: web
    name: fund-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL        # Neon 连接串，部署时在 Render 面板填入
        sync: false
      - key: TZ                  # 交易日/盘中判断依赖北京时间，必须设置
        value: Asia/Shanghai
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VAPID_PRIVATE_KEY   # Web Push 私钥（PEM），不配则自动生成存 DB
        sync: false
      - key: VAPID_PUBLIC_KEY    # Web Push 公钥，与私钥配对
        sync: false
      - key: VAPID_SUBJECT       # 推送主体：mailto:你的邮箱 或 https://你的域名
        sync: false
