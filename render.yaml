services:
  - type: web
    name: fund-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL        # Neon 连接串，部署时在 Render 面板填入
        sync: false
      - key: TZ                  # 交易日/盘中判断依赖北京时间，必须设置
        value: Asia/Shanghai
      - key: PYTHON_VERSION
        value: 3.11.9
